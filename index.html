<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Un site de démonstration simple et moderne créé avec ChatGPT."
    />
    <title>Mon premier site créé avec un agent ChatGPT</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">DÉMONSTRATION WEB</p>
      <h1>Mon premier site créé avec un agent ChatGPT</h1>
      <p class="intro">
        Ce site de démonstration a été créé avec ChatGPT pour illustrer la
        réalisation d’une page web simple, interactive et prête à être publiée.
      </p>

      <section class="counter" aria-labelledby="counter-title">
        <h2 id="counter-title">Compteur interactif</h2>
        <button id="click-button" type="button">Cliquez-moi</button>
        <p class="count" aria-live="polite">
          Nombre de clics : <strong id="click-count">0</strong>
        </p>
      </section>
    </main>
  </body>
</html>
